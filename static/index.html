<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workforce Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#10140f; --panel:#171d16; --line:#2c3a28; --ink:#e7efe4; --muted:#93a390; --good:#b6e27a; --warn:#e2c36b; --bad:#e08b73; }
    * { box-sizing: border-box; }
    body { margin:0; background: radial-gradient(circle at top right, #243022, var(--bg) 40%); color:var(--ink); font-family:"IBM Plex Mono", monospace; }
    .wrap { max-width:1180px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-family: Fraunces, serif; font-size:34px; margin:0; }
    .sub { color:var(--muted); margin:6px 0 18px; font-size:13px; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
    @media (max-width:800px){ .kpis{grid-template-columns:1fr 1fr;} }
    .kpi { background:var(--panel); border:1px solid var(--line); padding:12px; border-radius:10px; }
    .kpi b { display:block; font-size:20px; margin-top:4px; color:var(--good); }
    .grid { display:grid; grid-template-columns:280px 1fr 300px; gap:12px; }
    @media (max-width:980px){ .grid{grid-template-columns:1fr;} }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .card h2 { margin:0; padding:12px 14px 0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--warn); }
    .pad { padding:12px 14px 14px; }
    textarea { width:100%; min-height:120px; background:#10150f; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
    button { font:inherit; cursor:pointer; }
    .go { width:100%; margin-top:8px; padding:10px; background:var(--good); color:#14200c; border:0; border-radius:999px; font-weight:600; }
    .chip { display:block; width:100%; text-align:left; margin:6px 0; padding:8px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; }
    #feed, #trace { min-height:420px; max-height:62vh; overflow:auto; padding:8px 14px 14px; }
    .msg { border-left:3px solid var(--line); margin:10px 0; padding:8px 10px; background:#121812; }
    .msg.tool { border-color:var(--good); }
    .msg.final { border-color:var(--warn); }
    .msg.error { border-color:var(--bad); }
    .k { color:var(--muted); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    pre { white-space:pre-wrap; margin:6px 0 0; font-size:13px; line-height:1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Workforce Scout</h1>
    <div class="sub">Headcount planning agent · FTE, loaded cost, cap, hire timing</div>
    <div class="kpis">
      <div class="kpi">Current FTE<b id="k-fte">—</b></div>
      <div class="kpi">Open req FTE<b id="k-req">—</b></div>
      <div class="kpi">Base 6-mo cost<b id="k-cost">—</b></div>
      <div class="kpi">Headroom vs cap<b id="k-head">—</b></div>
    </div>
    <div class="grid">
      <section class="card"><h2>Ask</h2><div class="pad">
        <textarea id="prompt"></textarea>
        <button class="go" id="run">Run plan</button>
        <div id="presets"></div>
      </div></section>
      <section class="card"><h2>Working paper</h2><div id="feed"></div></section>
      <section class="card"><h2>Tool tape</h2><div id="trace"></div></section>
    </div>
  </div>
  <script>
    const money = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
    function add(target, kind, title, body) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.innerHTML = `<div class="k">${title}</div><pre></pre>`;
      el.querySelector("pre").textContent = body || "";
      target.appendChild(el);
      target.scrollTop = target.scrollHeight;
    }
    async function boot() {
      const data = await (await fetch("/api/presets")).json();
      const s = data.snapshot;
      document.getElementById("k-fte").textContent = s.current_fte;
      document.getElementById("k-req").textContent = s.open_req_fte;
      document.getElementById("k-cost").textContent = money(s.window_loaded_cost);
      const head = document.getElementById("k-head");
      head.textContent = money(s.headroom);
      head.style.color = s.headroom >= 0 ? "var(--good)" : "var(--bad)";
      const box = document.getElementById("presets");
      data.presets.forEach(p => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = p.label;
        b.onclick = () => document.getElementById("prompt").value = p.prompt;
        box.appendChild(b);
      });
      document.getElementById("prompt").value = data.presets[0].prompt;
    }
    async function launch() {
      const feed = document.getElementById("feed");
      const trace = document.getElementById("trace");
      feed.innerHTML = "";
      trace.innerHTML = "";
      const res = await fetch("/api/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt: document.getElementById("prompt").value})
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          const ev = JSON.parse(part.slice(6));
          if (ev.type === "done") continue;
          if (ev.type === "tool") {
            const body = ev.result ? `${ev.name}\n${ev.result}` : ev.name;
            add(feed, "tool", ev.result ? "result" : "tool", body);
            add(trace, "tool", ev.name, ev.result || "running");
          } else {
            add(feed, ev.type || "status", ev.type || "note", ev.text || "");
          }
        }
      }
    }
    document.getElementById("run").onclick = launch;
    boot();
  </script>
</body>
</html>
